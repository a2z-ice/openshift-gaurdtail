# ---------------------------------------------------------------------------
# RBAC for the guardrail workflow.
# RBAC decides WHO may touch a critical object at all; the admission policy decides
# WHAT they may change (only their own approval/request annotations). RBAC alone cannot
# restrict a patch to annotations, which is why both layers exist.
# All objects are named guardrails-* and are therefore protected by name in the policy.
# ---------------------------------------------------------------------------
# Approvers/requesters: may READ and PATCH the protected kinds (policy limits the patch to annotations). NO delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guardrails-approver
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
rules:
  - apiGroups: ["guardrails.example.com"]
    resources: ["guardrailconfigs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["argocds", "applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions", "operatorgroups"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["olm.operatorframework.io"]
    resources: ["clusterextensions"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["apiservers", "oauths"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["lokistacks", "alertingrules", "rulerconfigs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["observability.openshift.io"]
    resources: ["clusterlogforwarders"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "alertmanagerconfigs"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["velero.io"]
    resources: ["schedules", "backupstoragelocations"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["oadp.openshift.io"]
    resources: ["dataprotectionapplications"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch"]
---
# Executors: the people allowed to run the final `oc delete` once approvals are in place.
# Deliberately a SEPARATE role so that "can approve" and "can execute" are different grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guardrails-executor
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["argocds", "applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["namespaces", "secrets", "configmaps"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions", "clusterserviceversions", "operatorgroups"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["loki.grafana.com", "observability.openshift.io", "monitoring.coreos.com", "velero.io", "oadp.openshift.io"]
    resources: ["*"]
    verbs: ["get", "list", "delete"]
---
# Auditors: read everything, change nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardrails-auditors-view
  labels:
    app.kubernetes.io/part-of: guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: auditors
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardrails-approvers
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guardrails-approver
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: gitops-deletion-approvers
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: gitops-deletion-requesters
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardrails-executors
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guardrails-executor
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: gitops-deletion-requesters
---
# Time-boxed cluster-admin. The group is EMPTY at rest; the IdP (Entra PIM / Okta / LDAP JIT) adds a
# person for a bounded window. This is the ONLY cluster-admin binding for humans.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardrails-platform-admins
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: platform-admins
