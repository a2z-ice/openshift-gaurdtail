# Namespaced RoleBindings: one pair per platform namespace. Add a pair when a new critical namespace appears.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardrails-approvers
  namespace: openshift-gitops
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guardrails-approver-namespaced
subjects:
  - { kind: Group, apiGroup: rbac.authorization.k8s.io, name: gitops-deletion-approvers }
  - { kind: Group, apiGroup: rbac.authorization.k8s.io, name: gitops-deletion-requesters }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
