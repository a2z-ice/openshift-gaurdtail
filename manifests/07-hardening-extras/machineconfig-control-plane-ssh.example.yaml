# ---------------------------------------------------------------------------
# EXAMPLE (not in kustomization; apply deliberately): removes interactive SSH from control-plane
# nodes. Node-level access is the one path around the admission guardrail (residual risk R2).
# With this in place the only way onto a master is `oc debug node/...`, which is an API request,
# audited, and alerted by ControlPlaneNodeAccess.
# Effects: sshd is masked. NOTE: the MCO MERGES sshAuthorizedKeys across MachineConfigs, so an empty list here
# does NOT remove the installer's key from 99-master-ssh; masking sshd is the effective control. To remove the
# key as well, edit/delete the 99-master-ssh MachineConfig in the same PR. Re-enable by deleting this MachineConfig (rolls the masters).
# Do NOT apply to workers without a separate decision; do not apply on SNO without console access.
# ---------------------------------------------------------------------------
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-disable-ssh
  labels:
    machineconfiguration.openshift.io/role: master
    guardrails.example.com/critical: "true"
spec:
  config:
    ignition:
      version: 3.4.0
    passwd:
      users:
        - name: core
          sshAuthorizedKeys: []
    systemd:
      units:
        - name: sshd.service
          enabled: false
          mask: true
