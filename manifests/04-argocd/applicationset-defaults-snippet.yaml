# ---------------------------------------------------------------------------
# REFERENCE SNIPPET (not applied by kustomize): the settings every ApplicationSet that
# generates production Applications must carry. Copy into your ApplicationSets.
#   preserveResourcesOnDeletion: true  => generated Applications get NO cascade finalizer;
#                                         deleting the ApplicationSet out of band leaves workloads running
#   prune: true is fine for Git-managed apps (the Git ruleset is the approval); keep prune: false only for
#   applications whose repository does not enforce two reviewers
#   policy: sync + allowPolicyOverride false  => no per-app override that re-enables prune
# Argo CD only honours preserveResourcesOnDeletion at Application CREATION; for existing
# Applications remove the finalizer once:
#   oc -n openshift-gitops patch application <app> --type json \
#     -p '[{"op":"remove","path":"/metadata/finalizers"}]'
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: EXAMPLE-production-apps
  namespace: openshift-gitops
  labels:
    guardrails.example.com/critical: "true"
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: sync
  generators:
    - git:
        repoURL: https://github.com/example-org/apps.git
        revision: main
        directories:
          - path: environments/prod/*
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        guardrails.example.com/critical: "true"
    spec:
      project: production
      source:
        repoURL: https://github.com/example-org/apps.git
        targetRevision: main
        path: "{{ .path.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true          # Git is the source of truth; set false only if the app repo lacks the 2-reviewer ruleset
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
