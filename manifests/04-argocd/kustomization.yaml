apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - appproject-guardrails.yaml
  - appproject-default-locked.yaml
  - application-guardrails.yaml
  # The ArgoCD CR already exists (created by the operator). It is rendered here so Git owns the
  # hardening fields; Argo CD applies it server-side and merges with the operator-managed fields.
  - argocd-cr-hardening-patch.yaml
