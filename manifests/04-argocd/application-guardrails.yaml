# ---------------------------------------------------------------------------
# App-of-apps that keeps the guardrails in place (self-heal). Git is the source of truth:
#   - prune: true             => removing a manifest from Git (merged through the 2-reviewer ruleset) removes the
#                                live object; the Argo CD controller is a gitopsController (pre-approved path)
#   - no Argo CD cascade finalizer => deleting this Application OUT OF BAND (UI/oc) does not delete the policies;
#                                the Application itself is critical, so that delete needs the workflow anyway
#   - selfHeal: true          => any out-of-band change is reverted within the reconcile interval
#   - ServerSideApply         => Argo CD owns only the fields it sets; approval annotations added by humans survive
# Point spec.source.path at the overlay for the current rollout phase.
# ---------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guardrails
  namespace: openshift-gitops
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
  annotations:
    guardrails.example.com/owner: platform-engineering
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: guardrails
  source:
    repoURL: https://github.com/example-org/openshift-administration.git
    targetRevision: main
    path: manifests/overlays/phase3-enforce
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: "*"
      kind: "*"
      jsonPointers:
        - /metadata/annotations/guardrails.example.com~1delete-request
        - /metadata/annotations/guardrails.example.com~1delete-requested-by
        - /metadata/annotations/guardrails.example.com~1delete-approvals
    - group: user.openshift.io
      kind: Group
      jsonPointers:
        - /users          # membership owned by the IdP group sync, not by Git
  revisionHistoryLimit: 10
