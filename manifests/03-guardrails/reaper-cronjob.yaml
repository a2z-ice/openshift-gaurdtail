# ---------------------------------------------------------------------------
# Approval reaper
# Purpose : CEL in admission has no clock, so the two lifetimes of the deletion workflow are enforced
#           by this CronJob. Every 10 minutes it scans every Tier-A kind and
#             * withdraws requests older than GuardrailConfig.spec.requestTTL (default 24h) - or undated,
#               invalid or future-dated - clearing request, requested-by, requested-at and approvals together;
#             * removes approval entries older than spec.approvalTTL (default 4h) or future-dated/invalid.
#           The policy only lets this identity remove entries, never add any (see V3/V4).
#           Effective lifetime = TTL + up to one schedule interval (10 min) + job runtime.
# Phase   : 1
# Rollback: oc delete cronjob approval-reaper -n guardrails-system
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: approval-reaper
  namespace: guardrails-system
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guardrails-approval-reaper
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
rules:
  - apiGroups: ["guardrails.example.com"]
    resources: ["guardrailconfigs"]
    verbs: ["get", "list", "patch"]
  # get/list/patch (NO delete, NO create) on the Tier-A kinds where approvals are recorded.
  # Deliberately NOT: secrets, serviceaccounts, namespaces, CRDs, OLM objects, groups, cluster RBAC,
  # apiservers/oauths, VAP/VAPB. A stolen reaper token must not be able to read secrets or touch privileged
  # objects; approvals on those kinds (rare) are cleared by hand when stale.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["argocds", "applications", "applicationsets", "appprojects"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["loki.grafana.com"]
    resources: ["lokistacks", "alertingrules", "rulerconfigs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["observability.openshift.io"]
    resources: ["clusterlogforwarders"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "alertmanagerconfigs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["velero.io"]
    resources: ["schedules", "backupstoragelocations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["oadp.openshift.io"]
    resources: ["dataprotectionapplications"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guardrails-approval-reaper
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guardrails-approval-reaper
subjects:
  - kind: ServiceAccount
    name: approval-reaper
    namespace: guardrails-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: approval-reaper
  namespace: guardrails-system
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
data:
  # group/version/resource list the reaper scans (cluster-wide)
  resources.txt: |
    # Tier-A kinds only (see 02-rbac/clusterroles.yaml). Kinds whose CRD is absent are skipped.
    v1/configmaps
    guardrails.example.com/v1alpha1/guardrailconfigs
    argoproj.io/v1beta1/argocds
    argoproj.io/v1alpha1/applications
    argoproj.io/v1alpha1/applicationsets
    argoproj.io/v1alpha1/appprojects
    rbac.authorization.k8s.io/v1/roles
    rbac.authorization.k8s.io/v1/rolebindings
    loki.grafana.com/v1/lokistacks
    loki.grafana.com/v1/alertingrules
    loki.grafana.com/v1/rulerconfigs
    observability.openshift.io/v1/clusterlogforwarders
    monitoring.coreos.com/v1/prometheusrules
    monitoring.coreos.com/v1alpha1/alertmanagerconfigs
    velero.io/v1/schedules
    velero.io/v1/backupstoragelocations
    oadp.openshift.io/v1alpha1/dataprotectionapplications
    batch/v1/cronjobs
    networking.k8s.io/v1/networkpolicies
  reap.sh: |
    #!/usr/bin/env bash
    # 1. Withdraws deletion REQUESTS older than GuardrailConfig.spec.requestTTL (or future-dated / undated / invalid
    #    delete-requested-at): clears request, requested-by, requested-at and approvals in ONE write.
    # 2. Removes approval ENTRIES older than spec.approvalTTL (or future-dated / invalid).
    # Runs as the reaper SA: the admission policy allows it to REMOVE only (V3/V4); guardrails-deletion-tracker
    # records each removal as event=expired / event=request-expired, which notifies the approvers channel.
    set -euo pipefail
    PFX="guardrails.example.com"
    ANN="${PFX}/delete-approvals"
    to_sec() {  # to_sec <4h|30m> -> seconds
      case "$1" in
        *h) echo $(( ${1%h} * 3600 )) ;;
        *m) echo $(( ${1%m} * 60 )) ;;
        *)  echo "unparseable TTL '$1'" >&2; exit 1 ;;
      esac
    }
    TTL_RAW="$(oc get guardrailconfig default -o jsonpath='{.spec.approvalTTL}')"
    REQ_TTL_RAW="$(oc get guardrailconfig default -o jsonpath='{.spec.requestTTL}')"; REQ_TTL_RAW="${REQ_TTL_RAW:-24h}"
    TTL_SEC="$(to_sec "$TTL_RAW")"; REQ_TTL_SEC="$(to_sec "$REQ_TTL_RAW")"
    NOW=$(date -u +%s)
    # strict RFC3339 UTC only: GNU date would also accept "" (today 00:00) or words such as "yesterday"
    RFC3339='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
    epoch() { if [[ "$1" =~ $RFC3339 ]]; then date -u -d "$1" +%s 2>/dev/null || echo 0; else echo 0; fi; }
    export HOME=/tmp
    echo "reaper start approvalTTL=${TTL_RAW} requestTTL=${REQ_TTL_RAW} now=$(date -u -Is)"
    while read -r GVR; do
      [[ -z "$GVR" || "$GVR" == \#* ]] && continue
      # oc get accepts <resource>.<version>.<group>; core group has no group part
      IFS='/' read -r -a P <<< "$GVR"
      if [[ ${#P[@]} -eq 2 ]]; then RES="${P[1]}"; else RES="${P[2]}.${P[1]}.${P[0]}"; fi
      # objects with a request or approvals: "<ns>|<name>|<resourceVersion>|<has-request>|<requested-at>|<approvals>"
      # (approvals last: it contains '|'); a missing CRD is skipped, not fatal
      { oc get "$RES" --all-namespaces --ignore-not-found \
          -o go-template='{{range .items}}{{$item := .}}{{with .metadata.annotations}}{{if or (index . "guardrails.example.com/delete-approvals") (index . "guardrails.example.com/delete-request")}}{{with $item.metadata.namespace}}{{.}}{{end}}|{{$item.metadata.name}}|{{$item.metadata.resourceVersion}}|{{if index . "guardrails.example.com/delete-request"}}1{{end}}|{{with index . "guardrails.example.com/delete-requested-at"}}{{.}}{{end}}|{{with index . "guardrails.example.com/delete-approvals"}}{{.}}{{end}}{{"\n"}}{{end}}{{end}}{{end}}' 2>/dev/null || true; } \
      | while IFS='|' read -r NS NAME RV HASREQ REQAT RAW; do
          [[ -z "$NAME" ]] && continue
          NSARG=(); [[ -n "$NS" ]] && NSARG=(-n "$NS")
          WHERE="${RES} ${NS:-<cluster>}/${NAME}"
          # ---- 1. request lifetime
          if [[ -n "$HASREQ" ]]; then
            RA_SEC=$(epoch "$REQAT")
            if (( RA_SEC == 0 || NOW - RA_SEC > REQ_TTL_SEC || RA_SEC > NOW + 300 )); then
              echo "withdraw ${WHERE} requested_at=${REQAT:-<none>} (requestTTL exceeded, undated, invalid or future-dated)"
              # --resource-version: never overwrite a concurrent change (conflict -> retried next run)
              oc annotate ${NSARG[@]+"${NSARG[@]}"} "$RES" "$NAME" --overwrite --resource-version="$RV" \
                "${PFX}/delete-request-" "${PFX}/delete-requested-by-" "${PFX}/delete-requested-at-" "${ANN}-" \
                || echo "conflict on ${WHERE}; will retry"
              continue
            fi
          fi
          # ---- 2. approval lifetime
          KEEP=""
          if [[ -n "$RAW" ]]; then
            IFS=',' read -r -a ENTRIES <<< "$RAW"
            for E in "${ENTRIES[@]}"; do
              U="${E%%|*}"; TS="${E#*|}"
              TS_SEC=$(epoch "$TS")
              # expired (older than TTL) OR implausible (more than 5 min in the future: an approver cannot
              # extend their own approval by writing a far-future timestamp) OR unparseable (TS_SEC=0)
              if (( NOW - TS_SEC > TTL_SEC || TS_SEC > NOW + 300 )); then
                echo "expire ${WHERE} approver=${U} at=${TS} (ttl or future/invalid timestamp)"
              else
                KEEP="${KEEP:+${KEEP},}${E}"
              fi
            done
          fi
          if [[ "$KEEP" != "$RAW" ]]; then
            if [[ -z "$KEEP" ]]; then
              oc annotate ${NSARG[@]+"${NSARG[@]}"} "$RES" "$NAME" "${ANN}-" --overwrite --resource-version="$RV" || echo "conflict on ${WHERE}; will retry"
            else
              oc annotate ${NSARG[@]+"${NSARG[@]}"} "$RES" "$NAME" "${ANN}=${KEEP}" --overwrite --resource-version="$RV" || echo "conflict on ${WHERE}; will retry"
            fi
          fi
          if [[ -n "$HASREQ" ]]; then echo "pending ${WHERE} requested_at=${REQAT} approvals=${KEEP:-<none>}"; fi
        done
    done < /config/resources.txt
    echo "reaper done"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: approval-reaper
  namespace: guardrails-system
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: approval-reaper
        spec:
          serviceAccountName: approval-reaper
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.21
              command: ["/bin/bash", "/config/reap.sh"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: config
                  mountPath: /config
          volumes:
            - name: config
              configMap:
                name: approval-reaper
                defaultMode: 0555
