# ---------------------------------------------------------------------------
# GuardrailConfig "default" - the ONLY instance; all policy bindings reference it.
# Phase   : 1
# Rollback: not applicable; edit values via PR (2 reviewers) - enforced by the policies themselves.
# ---------------------------------------------------------------------------
apiVersion: guardrails.example.com/v1alpha1
kind: GuardrailConfig
metadata:
  name: default
  labels:
    guardrails.example.com/critical: "true"
    app.kubernetes.io/part-of: guardrails
  annotations:
    guardrails.example.com/owner: platform-engineering
spec:
  minApprovers: 2
  executorMayBeApprover: false
  approverGroups:
    - gitops-deletion-approvers
  requesterGroups:
    - gitops-deletion-requesters
    - gitops-operators
  exemptUsers:
    - system:apiserver
    - system:serviceaccount:guardrails-system:breakglass        # token under dual control in the vault; every use is a P1 alert
  olmServiceAccounts:
    - system:serviceaccount:openshift-operator-lifecycle-manager:olm-operator-serviceaccount   # may delete superseded CSVs on upgrade
  reaperUsers:
    - system:serviceaccount:guardrails-system:approval-reaper
  # THE GITOPS PATH: what these identities apply was merged through the repository ruleset (2 reviewers + code owners),
  # so it is pre-approved. They are exempt from the two-person rule; their deletions are alerted as GitOpsCriticalDeletionApplied.
  gitopsControllers:
    - system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller   # syncs and prunes from Git
    - system:serviceaccount:openshift-gitops:openshift-gitops-applicationset-controller       # generates Applications from Git
  # TRUSTED MUTATORS: may update critical objects (and add the critical label) but are NOT exempt from deletion.
  # argocd-server acts for UI/CLI users - those actions are not Git-reviewed, so a UI delete still needs the workflow.
  gitopsServiceAccounts:
    - system:serviceaccount:openshift-gitops:openshift-gitops-argocd-server                   # UI/CLI sync & refresh write .operation and the refresh annotation
    - system:serviceaccount:openshift-gitops-operator:openshift-gitops-operator-controller-manager   # reconciles the ArgoCD CR
    # add here, after observing ArgoCDDirectMutation in phases 1-3, any controller that legitimately
    # writes critical objects: system:serviceaccount:guardrails-system:ldap-group-sync (Group membership),
    # system:serviceaccount:external-secrets:external-secrets (critical Secrets), system:serviceaccount:openshift-adp:velero
    # (restores). Never a human, never the reaper (it only needs the annotation-only path).
  privilegedClusterRoles:
    - cluster-admin
    - admin
    - guardrails-approver
    - guardrails-breakglass
  privilegedGroups:
    - platform-admins
    - gitops-deletion-approvers
    - gitops-deletion-requesters
  # Anti-impersonation markers (docs/17). A real OAuth session carries scopes.authorization.openshift.io in
  # userInfo.extra; a real service-account token carries authentication.kubernetes.io/credential-id. Impersonated
  # sessions carry neither, because no human role may impersonate userextras.
  humanAuthExtraKey: scopes.authorization.openshift.io
  requireBoundTokenForPrivileged: true
  approvalTTL: 4h
  runbookURL: https://github.com/example-org/openshift-administration/blob/main/docs/09-runbooks.md
