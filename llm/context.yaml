# Machine-readable facts for AI tools. Single source; AGENTS.md is the prose twin. Keep both in sync.
repo:
  purpose: OpenShift 4.21 audit trail + two-person rule for OUT-OF-BAND deletion of critical resources (ValidatingAdmissionPolicy) + email/Teams alerting + backups. GitOps path (Argo CD controllers applying merged PRs) is pre-approved and exempt.
  entrypoints: [AGENTS.md, llm/memory.md, .claude/skills/]
  validate: ["for o in manifests/base manifests/overlays/*; do kustomize build \"$o\" >/dev/null; done", "yamllint -c .yamllint manifests", "bash -n scripts/*.sh"]
platform:
  ocp: "4.21"
  kubernetes: "1.34"
  alertmanager: "0.29.0"
  gitops: ">=1.19"
  logging_api: observability.openshift.io/v1
guardrail:
  prefix: guardrails.example.com
  critical_label: guardrails.example.com/critical=true
  annotations:
    request: guardrails.example.com/delete-request          # "<ticket>: <reason>"
    requested_by: guardrails.example.com/delete-requested-by # must equal caller
    requested_at: guardrails.example.com/delete-requested-at # RFC3339Z, required; request withdrawn after request_ttl
    approvals: guardrails.example.com/delete-approvals      # "user|RFC3339Z,user|RFC3339Z", append one entry per approver
  param: { kind: GuardrailConfig, apiVersion: guardrails.example.com/v1alpha1, name: default }
  min_approvers: 2
  executor_may_be_approver: false
  approval_ttl: 4h
  request_ttl: 24h
  exempt_users: [system:apiserver, system:serviceaccount:guardrails-system:breakglass]
  gitops_controllers_exempt: [system:serviceaccount:openshift-gitops:openshift-gitops-argocd-application-controller, system:serviceaccount:openshift-gitops:openshift-gitops-applicationset-controller]
  gitops_service_accounts_trusted_mutators: [system:serviceaccount:openshift-gitops:openshift-gitops-argocd-server, system:serviceaccount:openshift-gitops-operator:openshift-gitops-operator-controller-manager]
  olm_service_accounts_may_delete_csv: [system:serviceaccount:openshift-operator-lifecycle-manager:olm-operator-serviceaccount]
  rbac_tiers:
    tier_a_workflow: [argocds, applications, applicationsets, appprojects, guardrailconfigs, validatingadmissionpolicies, validatingadmissionpolicybindings, guardrails-* cluster RBAC, groups, apiservers, oauths, lokistacks, alertingrules, clusterlogforwarders, prometheusrules, schedules, dataprotectionapplications, named cronjobs/configmaps]
    tier_b_breakglass_or_git_only: [namespaces, customresourcedefinitions, subscriptions, clusterserviceversions, operatorgroups, secrets, serviceaccounts]
  reaper: { cronjob: guardrails-system/approval-reaper, schedule: every 10 min, may: remove-only, removes: [approvals older than approval_ttl, requests older than request_ttl, future-dated or invalid or undated entries] }
  notifications: { source: "audit annotation guardrails-deletion-tracker/state (event, have, need, remaining, ready, expiries)", route: 'audience="approvers" -> guardrail-approvers (approvers email list + Teams channel)', doc: docs/19 }
  policies:
    - { name: guardrails-critical-delete, bindings: [guardrails-critical-delete-labelled, guardrails-critical-delete-named], rules: [V1 delete, V2 label, V3 approvals, V4 request] }
    - { name: guardrails-impersonation-dry-run-only, bindings: [guardrails-impersonation-dry-run-only], rule: non-dry-run writes by identities lacking their auth marker are denied }
    - { name: guardrails-critical-label-control, bindings: [guardrails-critical-label-control], rule: only trusted identities may add the critical label }
    - { name: guardrails-gitops-only-mutation, bindings: [guardrails-gitops-only-mutation, guardrails-gitops-only-mutation-hardened], hardened_is_deny_in_all_phases: true }
    - { name: guardrails-rbac-escalation-audit, bindings: [guardrails-rbac-escalation-audit], never_denies: true }
    - { name: guardrails-deletion-tracker, bindings: [guardrails-deletion-tracker], never_denies: true, failure_policy: Ignore, records: approval state for notifications }
  name_protected:
    namespaces: [openshift-gitops, openshift-gitops-operator, guardrails-system, openshift-logging, openshift-adp]
    crd_groups: [argoproj.io, guardrails.example.com, loki.grafana.com, observability.openshift.io, velero.io, oadp.openshift.io]
    name_prefix: guardrails-
    other: [ArgoCD/openshift-gitops, APIServer/cluster, OLM objects in openshift-gitops-operator, groups platform-admins/gitops-deletion-*]
impersonation:
  allowed_for: [reads, access reviews, --dry-run=client, --dry-run=server]
  human_marker: scopes.authorization.openshift.io
  sa_marker: authentication.kubernetes.io/credential-id
  rbac: platform-admins bound to guardrails-platform-admin (no impersonate/escalate/bind) + guardrails-impersonator (users/groups/serviceaccounts only, never userextras)
groups:
  platform-admins: guardrails-platform-admin (all verbs except impersonate/escalate/bind), JIT, empty at rest
  gitops-deletion-approvers: may approve (>=4 members, >=2 teams)
  gitops-deletion-requesters: may request and execute
  gitops-operators: Argo CD day-2, no delete
  auditors: read-only
phases:
  - { id: 1, overlay: manifests/overlays/phase1-audit, delete_actions: [Audit] }
  - { id: 2, overlay: manifests/overlays/phase2-warn, delete_actions: [Warn, Audit] }
  - { id: 3, overlay: manifests/overlays/phase3-enforce, delete_actions: [Deny, Audit], mutation_actions: [Audit] }
  - { id: 4, overlay: manifests/overlays/phase4-gitops-only, delete_actions: [Deny, Audit], mutation_actions: [Deny, Audit] }
phase_selector: 'spec.source.path of Application openshift-gitops/guardrails (change via PR)'
alerts:
  label: guardrail=true
  critical_route: { receivers: [email, msteamsv2], group_wait: 0s, repeat: 30m }
  key_alerts: [CriticalResourceDeleted, GitOpsCriticalDeletionApplied, GitOpsResourceDeleted, CriticalResourceDeleteDenied, CriticalDeleteWouldBeDenied, ArgoCDCredentialSecretDeleted, GuardrailPolicyModified, AuditProfileChanged, PrivilegedRBACChange, ImpersonationUsed, PrivilegedIdentityImpersonated, PrivilegedTokenMinted, BreakGlassUsed, KubeadminOrSystemAdminUsed, ArgoCDApplicationControllerMissing, GitOpsNamespaceTerminating, AuditLogIngestionStalled, GuardrailPolicyEvaluationErrors, GuardrailNotificationFailing, ImpersonatedWriteDenied, GuardrailReaperNotRunning, ArgoCDApplicationWrittenOutOfBand, AdmissionWebhookConfigurationChanged, NamespaceStuckTerminating, CriticalDeletionRequested, CriticalDeletionApproved, CriticalDeletionApprovalsExpired, CriticalDeletionRequestClosed, CriticalDeletionPendingApproval, CriticalDeletionAwaitingExecution]
audit:
  profile: WriteRequestBodies
  loki_tenant: audit
  loki_fields: [verb, user_username, impersonatedUser_username, objectRef_resource, objectRef_namespace, objectRef_name, responseStatus_code, annotations_guardrails_critical_delete_decision, annotations_validation_policy_admission_k8s_io_validation_failure]
  siem: { type: splunk, index: openshift_audit }
scripts:
  request: 'scripts/request-deletion.sh <res> <name> [-n ns] "<ticket>: <reason>"'
  approve: scripts/approve-deletion.sh <res> <name> [-n ns]
  execute: scripts/execute-deletion.sh <res> <name> [-n ns]
  cancel: scripts/cancel-deletion.sh <res> <name> [-n ns]
  verify: scripts/verify-install.sh
  test: scripts/test-guardrails.sh
  audit_query: scripts/audit-query.sh <name>
never:
  - add a human to exemptUsers or gitopsControllers; never argocd-server in gitopsControllers
  - minApprovers < 2 or executorMayBeApprover true
  - remove Deny from phase-3/4 bindings
  - resources-finalizer on the guardrails Application (prune=true is correct: Git is the source of truth)
  - impersonation, kubeadmin, system:admin or break-glass to pass a deletion
  - secrets in Git
  - hand-apply manifests outside phase-1 bootstrap / break-glass
