name: policy-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      HAS_PREPROD: ${{ secrets.PREPROD_KUBECONFIG != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.6.0 /usr/local/bin
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          pipx install yamllint
      - name: yamllint
        run: yamllint -c .yamllint manifests
      - name: kustomize build (all phases)
        run: |
          set -euo pipefail
          mkdir -p out
          for o in manifests/base manifests/overlays/phase1-audit manifests/overlays/phase2-warn manifests/overlays/phase3-enforce manifests/overlays/phase4-gitops-only; do
            kustomize build "$o" > "out/$(basename "$o").yaml"
          done
      - name: kubeconform (schema validation; CRDs skipped)
        run: |
          set -euo pipefail
          for f in out/*.yaml; do
            kubeconform -strict -ignore-missing-schemas -kubernetes-version master \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -summary "$f"
          done
      - name: guardrail invariants
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, sys
          fail = []
          docs = list(yaml.safe_load_all(open('manifests/03-guardrails/vap-critical-delete-bindings.yaml')))
          for d in docs:
              if d and d['kind'] == 'ValidatingAdmissionPolicyBinding' and 'Deny' not in d['spec']['validationActions']:
                  fail.append(f"{d['metadata']['name']}: base binding must include Deny")
          for d in yaml.safe_load_all(open('manifests/03-guardrails/vap-gitops-only-mutation.yaml')):
              if d and d['kind'] == 'ValidatingAdmissionPolicyBinding' and d['metadata']['name'].endswith('-hardened') and 'Deny' not in d['spec']['validationActions']:
                  fail.append('hardened binding must Deny')
          cfg = yaml.safe_load(open('manifests/03-guardrails/guardrailconfig-default.yaml'))['spec']
          if cfg['minApprovers'] < 2: fail.append('minApprovers < 2')
          if cfg.get('executorMayBeApprover'): fail.append('executorMayBeApprover must be false')
          for u in cfg['exemptUsers']:
              if u not in ('system:apiserver', 'system:serviceaccount:guardrails-system:breakglass'): fail.append(f'unexpected exempt identity {u}')
          for u in cfg['gitopsControllers']:
              if not u.startswith('system:serviceaccount:openshift-gitops:'): fail.append(f'gitopsControllers may only hold Argo CD controllers: {u}')
          if 'system:serviceaccount:openshift-gitops:openshift-gitops-argocd-server' in cfg['gitopsControllers']: fail.append('argocd-server must not be a gitopsController (UI actions are not Git-reviewed)')
          for u in cfg['gitopsServiceAccounts'] + cfg['reaperUsers']:
              if not u.startswith('system:serviceaccount:'): fail.append(f'human in trusted list: {u}')
          app = yaml.safe_load(open('manifests/04-argocd/application-guardrails.yaml'))
          if app['metadata'].get('finalizers'): fail.append('guardrails Application must not carry a cascade finalizer')
          if not app['spec']['syncPolicy']['automated'].get('selfHeal'): fail.append('selfHeal must be true')
          print('\n'.join(fail) or 'invariants OK'); sys.exit(1 if fail else 0)
          PY
          # no plaintext secrets
          ! grep -RIE 'sig=[A-Za-z0-9_-]{20,}|smtp_auth_password: *[^R]' manifests | grep -v REPLACE
      - name: mermaid diagrams parse (GitHub renders with the same engine)
        run: |
          npm install --no-save --silent mermaid@11 jsdom dompurify
          node scripts/check-mermaid.mjs README.md docs/*.md
      - name: shellcheck scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x --severity=warning scripts/*.sh
      - name: Server-side dry-run on pre-prod (optional; set the PREPROD_KUBECONFIG repository secret)
        if: ${{ env.HAS_PREPROD == 'true' }}
        env:
          PREPROD_KUBECONFIG: ${{ secrets.PREPROD_KUBECONFIG }}
        run: |
          echo "$PREPROD_KUBECONFIG" > kc; export KUBECONFIG=kc
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.21/openshift-client-linux.tar.gz | tar xz -C /usr/local/bin oc
          oc apply --server-side --dry-run=server -f out/phase3-enforce.yaml
