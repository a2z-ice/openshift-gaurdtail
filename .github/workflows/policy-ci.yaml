name: policy-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      HAS_PREPROD: ${{ secrets.PREPROD_KUBECONFIG != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- 5.6.0 /usr/local/bin
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          pipx install yamllint
      - name: yamllint
        run: yamllint -c .yamllint manifests
      - name: kustomize build (all phases)
        run: |
          set -euo pipefail
          mkdir -p out
          for o in manifests/base manifests/overlays/phase1-audit manifests/overlays/phase2-warn manifests/overlays/phase3-enforce manifests/overlays/phase4-gitops-only; do
            kustomize build "$o" > "out/$(basename "$o").yaml"
          done
      - name: kubeconform (schema validation; CRDs skipped)
        run: |
          set -euo pipefail
          for f in out/*.yaml; do
            kubeconform -strict -ignore-missing-schemas -kubernetes-version master \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              -summary "$f"
          done
      - name: guardrail invariants
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, sys
          fail = []
          docs = list(yaml.safe_load_all(open('manifests/03-guardrails/vap-critical-delete-bindings.yaml')))
          for d in docs:
              if d and d['kind'] == 'ValidatingAdmissionPolicyBinding' and 'Deny' not in d['spec']['validationActions']:
                  fail.append(f"{d['metadata']['name']}: base binding must include Deny")
          for d in yaml.safe_load_all(open('manifests/03-guardrails/vap-gitops-only-mutation.yaml')):
              if d and d['kind'] == 'ValidatingAdmissionPolicyBinding' and d['metadata']['name'].endswith('-hardened') and 'Deny' not in d['spec']['validationActions']:
                  fail.append('hardened binding must Deny')
          cfg = yaml.safe_load(open('manifests/03-guardrails/guardrailconfig-default.yaml'))['spec']
          if cfg['minApprovers'] < 2: fail.append('minApprovers < 2')
          if cfg.get('executorMayBeApprover'): fail.append('executorMayBeApprover must be false')
          for u in cfg['exemptUsers']:
              if u not in ('system:apiserver', 'system:serviceaccount:guardrails-system:breakglass'): fail.append(f'unexpected exempt identity {u}')
          for u in cfg['gitopsControllers']:
              if not u.startswith('system:serviceaccount:openshift-gitops:'): fail.append(f'gitopsControllers may only hold Argo CD controllers: {u}')
          if 'system:serviceaccount:openshift-gitops:openshift-gitops-argocd-server' in cfg['gitopsControllers']: fail.append('argocd-server must not be a gitopsController (UI actions are not Git-reviewed)')
          for u in cfg['gitopsServiceAccounts'] + cfg['reaperUsers']:
              if not u.startswith('system:serviceaccount:'): fail.append(f'human in trusted list: {u}')
          import glob
          for f in glob.glob('manifests/02-rbac/*.yaml'):
              for d in yaml.safe_load_all(open(f)):
                  if not d: continue
                  if d['kind'] == 'ClusterRoleBinding' and d['roleRef']['name'] == 'cluster-admin': fail.append(f"{d['metadata']['name']} binds cluster-admin (use guardrails-platform-admin)")
                  if d['kind'] in ('ClusterRole', 'Role'):
                      for r in d.get('rules') or []:
                          verbs, res = r.get('verbs') or [], r.get('resources') or []
                          if ('impersonate' in verbs or '*' in verbs) and ('userextras' in res or 'uids' in res or ('*' in res and '*' in verbs)):
                              fail.append(f"{d['metadata']['name']} could impersonate userextras/uids")
                          if any(v in verbs for v in ('escalate', 'bind')) or ('*' in verbs and '*' in res):
                              fail.append(f"{d['metadata']['name']} grants escalate/bind or * verbs")
          if cfg.get('humanAuthExtraKey', 'x') == '' : fail.append('humanAuthExtraKey is empty (needs a written decision)')
          if cfg.get('requireBoundTokenForPrivileged', True) is False: fail.append('requireBoundTokenForPrivileged is false')
          # ---- CEL: every string literal terminated and every bracket balanced (catches a stray quote that
          #      YAML accepts but the API server rejects at compile time, e.g. a trailing " in a >- block)
          def cel_ok(e):
              i, depth, pairs = 0, [], {')': '(', ']': '[', '}': '{'}
              while i < len(e):
                  c = e[i]
                  if c in '\'"':
                      i += 1
                      while i < len(e) and e[i] != c:
                          i += 2 if e[i] == '\\' else 1
                      if i >= len(e): return 'unterminated string literal'
                  elif c in '([{': depth.append(c)
                  elif c in ')]}':
                      if not depth or depth.pop() != pairs[c]: return 'unbalanced ' + c
                  i += 1
              return 'unclosed bracket' if depth else None
          def walk(o, where):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if k in ('expression', 'valueExpression', 'messageExpression') and isinstance(v, str):
                          err = cel_ok(v)
                          if err: fail.append(f"CEL {where}/{o.get('name', o.get('key', k))}: {err}")
                      else: walk(v, where)
              elif isinstance(o, list):
                  for x in o: walk(x, where)
          for f in glob.glob('manifests/**/*.yaml', recursive=True):
              for d in yaml.safe_load_all(open(f)):
                  if d and d.get('kind') == 'ValidatingAdmissionPolicy': walk(d, f)
          # ---- deletion tracker: never enforces, and sees exactly what the deletion policy protects
          delp = next(yaml.safe_load_all(open('manifests/03-guardrails/vap-critical-delete.yaml')))['spec']
          trk = list(yaml.safe_load_all(open('manifests/03-guardrails/vap-deletion-tracker.yaml')))
          tp, tb = trk[0]['spec'], trk[1]['spec']
          var = lambda sp, n: next(v['expression'] for v in sp['variables'] if v['name'] == n)
          if tp.get('validations'): fail.append('guardrails-deletion-tracker must not have validations')
          if tp['failurePolicy'] != 'Ignore': fail.append('guardrails-deletion-tracker must be failurePolicy Ignore')
          if tb['validationActions'] != ['Audit']: fail.append('guardrails-deletion-tracker binding must be [Audit]')
          if var(tp, 'nameCritical') != var(delp, 'nameCritical'): fail.append('tracker nameCritical differs from guardrails-critical-delete')
          if tp['matchConstraints'] != delp['matchConstraints']: fail.append('tracker matchConstraints differ from guardrails-critical-delete')
          # ---- lifetimes: approvalTTL <= requestTTL <= reminder window; approvalTTL <= awaiting-execution window
          sec = lambda v: int(v[:-1]) * (3600 if v.endswith('h') else 60)
          if sec(cfg['approvalTTL']) > sec(cfg.get('requestTTL', '24h')): fail.append('approvalTTL must be <= requestTTL')
          loki = yaml.safe_load(open('manifests/05-alerting/loki-alertingrules-audit.yaml'))
          import re as _re
          win = {r['alert']: sec(_re.search(r'\[(\d+[hm])\]', r['expr']).group(1)) for g in loki['spec']['groups'] for r in g['rules'] if g['name'] == 'guardrails.approvals.reminders'}
          if win.get('CriticalDeletionPendingApproval', 0) < sec(cfg.get('requestTTL', '24h')): fail.append('CriticalDeletionPendingApproval window < requestTTL')
          if win.get('CriticalDeletionAwaitingExecution', 0) < sec(cfg['approvalTTL']): fail.append('CriticalDeletionAwaitingExecution window < approvalTTL')
          # ---- annotation contract: policy, scripts and Argo CD ignoreDifferences agree
          keys = ['delete-request', 'delete-requested-by', 'delete-requested-at', 'delete-approvals']
          lib = open('scripts/lib.sh').read(); appf = open('manifests/04-argocd/application-guardrails.yaml').read()
          vapf = open('manifests/03-guardrails/vap-critical-delete.yaml').read()
          for k in keys:
              if f'guardrails.example.com/{k}' not in vapf: fail.append(f'policy does not use {k}')
              if f'/{k}"' not in lib: fail.append(f'scripts/lib.sh lacks {k}')
              if f'guardrails.example.com~1{k}\n' not in appf: fail.append(f'Argo CD ignoreDifferences lacks {k}')
          app = yaml.safe_load(open('manifests/04-argocd/application-guardrails.yaml'))
          if app['metadata'].get('finalizers'): fail.append('guardrails Application must not carry a cascade finalizer')
          if not app['spec']['syncPolicy']['automated'].get('selfHeal'): fail.append('selfHeal must be true')
          print('\n'.join(fail) or 'invariants OK'); sys.exit(1 if fail else 0)
          PY
          # no plaintext secrets
          ! grep -RIE 'sig=[A-Za-z0-9_-]{20,}|smtp_auth_password: *[^R]' manifests | grep -v REPLACE
      - name: mermaid diagrams parse (GitHub renders with the same engine)
        run: |
          npm install --no-save --silent mermaid@11 jsdom dompurify
          node scripts/check-mermaid.mjs README.md docs/*.md
      - name: html docs are up to date (html/docs generated from Markdown)
        run: |
          npm install --no-save --silent marked
          node scripts/build-html-docs.mjs
          git diff --exit-code -- html/docs || { echo "html/docs is stale: run node scripts/build-html-docs.mjs and commit"; exit 1; }
      - name: shellcheck scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -x --severity=warning scripts/*.sh
      - name: Server-side dry-run on pre-prod (optional; set the PREPROD_KUBECONFIG repository secret)
        if: ${{ env.HAS_PREPROD == 'true' }}
        env:
          PREPROD_KUBECONFIG: ${{ secrets.PREPROD_KUBECONFIG }}
        run: |
          echo "$PREPROD_KUBECONFIG" > kc; export KUBECONFIG=kc
          curl -sSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.21/openshift-client-linux.tar.gz | tar xz -C /usr/local/bin oc
          oc apply --server-side --dry-run=server -f out/phase3-enforce.yaml
